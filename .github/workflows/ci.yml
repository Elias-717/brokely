name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Sync API image for Azure Container Apps (D-71), built only after every check passes.
  # Pushed to GitHub Container Registry as ghcr.io/elias-717/brokely-api:<commit> and :latest.
  api-image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/elias-717/brokely-api
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test (health answers, sync needs sign-in)
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:1/none \
            -e SUPABASE_URL=https://swkakkylbsewewulxgra.supabase.co \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/sync/pull?since=0)" = 401
          docker logs api

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
