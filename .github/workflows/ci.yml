name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Sync API image for Azure Container Apps (D-71), built only after every check passes.
  # Pushed to GitHub Container Registry as ghcr.io/elias-717/brokely-api:<commit> and :latest.
  api-image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/elias-717/brokely-api
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -f apps/api/Dockerfile -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Smoke test (health answers, sync needs sign-in)
        run: |
          docker run -d --name api -p 8080:8080 \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:1/none \
            -e SUPABASE_URL=https://swkakkylbsewewulxgra.supabase.co \
            "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 20); do curl -fs localhost:8080/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/sync/pull?since=0)" = 401
          docker logs api

      - name: Push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # Rolls the new image out to Azure Container Apps (D-71). GitHub signs in to Azure with
  # OpenID Connect: no password is stored, Azure trusts only this repo's main branch.
  # Off until the repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID and
  # AZURE_SUBSCRIPTION_ID exist (setup: apps/api/README.md).
  api-deploy:
    needs: api-image
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The commit tag, not :latest, so every deploy is a new revision that says which commit runs.
      - name: Deploy
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update --name brokely-api --resource-group brokely-rg \
            --image "ghcr.io/elias-717/brokely-api:${{ github.sha }}" --output none
          az containerapp show --name brokely-api --resource-group brokely-rg \
            --query "properties.latestRevisionName" --output tsv

      - name: Check it answers
        run: |
          for i in $(seq 1 30); do
            curl -fs https://brokely-api.ashyglacier-36b03c11.eastasia.azurecontainerapps.io/health && exit 0
            sleep 5
          done
          exit 1
