name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # TODO: once pnpm-lock.yaml is committed, add `cache: pnpm` here
      # and change the install step to `pnpm install --frozen-lockfile`.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
